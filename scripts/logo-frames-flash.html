<!doctype html>
<html>
<!--
  로고 영상 프레임 캡처 v2 — "가속 랩 + 카메라 플래시" (헤드리스 전용)
  모션: 도트가 천천히 기어가듯 출발 → 가속(easeInQuart) → 빠른 스윕으로
  정확히 한 바퀴 → 제자리에 탁 멈춤 → 사진 플래시처럼 찰칵(스웰+섬광 링).

  타임라인 30fps · 총 84프레임(2.8s):
    0–8    홀드 (정적 위치)
    9–56   랩 48f = 1.6s (easeInQuart — 후반 가속, 하드 스톱)
    57–71  플래시 15f = 0.5s (도트 스웰 → 섬광 링 확산·소멸 → 복귀)
    72–83  홀드
  방향: 반시계 (실제 400m 트랙 방향)
-->
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  #stage {
    width: 1080px; height: 1080px;
    display: flex; align-items: center; justify-content: center;
  }
  svg { width: 780px; height: 360px; overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <svg viewBox="0 0 260 120">
    <defs>
      <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
        <feDropShadow id="glowShadow" dx="0" dy="0" stdDeviation="5" flood-color="#FFB300" flood-opacity="0.5"/>
      </filter>
      <radialGradient id="burst">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="35%" stop-color="#FFD966" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <path id="orbit" d="M185 10 L60 10 A50 50 0 0 0 60 110 L200 110 A50 50 0 0 0 200 10 L185 10" fill="none" stroke="none"/>
    <rect x="10" y="10" width="240" height="100" rx="50" fill="none" stroke="#FFB300" stroke-width="7"/>
    <!-- 플래시 베일 — 화면이 순간 밝아지는 카메라 플래시감 (캔버스 전체 커버) -->
    <rect id="veil" x="-250" y="-200" width="760" height="520" fill="#FFFFFF" opacity="0"/>
    <!-- 섬광 버스트 + 충격파 링 (플래시 페이즈에만 표시) -->
    <circle id="flash" cx="185" cy="10" r="9" fill="url(#burst)" opacity="0"/>
    <circle id="shock" cx="185" cy="10" r="9" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0"/>
    <circle id="dot" cx="185" cy="10" r="9" fill="#FFB300" filter="url(#glow)"/>
  </svg>
</div>
<script>
  const HOLD_IN = 9, LAP = 48, FLASH = 15, HOLD_OUT = 12;
  const TOTAL = HOLD_IN + LAP + FLASH + HOLD_OUT; // 84

  const orbit = document.getElementById("orbit");
  const dot = document.getElementById("dot");
  const flash = document.getElementById("flash");
  const shock = document.getElementById("shock");
  const veil = document.getElementById("veil");
  const glowShadow = document.getElementById("glowShadow");
  const L = orbit.getTotalLength();

  const easeInQuart = (t) => t * t * t * t;

  window.TOTAL_FRAMES = TOTAL;
  window.setFrame = (i) => {
    /* ── 도트 궤도 위치 ── */
    let progress = 0;
    if (i >= HOLD_IN && i < HOLD_IN + LAP) {
      progress = easeInQuart((i - HOLD_IN + 1) / LAP);
    } else if (i >= HOLD_IN + LAP) {
      progress = 1;
    }
    const p = orbit.getPointAtLength((progress % 1) * L);
    dot.setAttribute("cx", p.x);
    dot.setAttribute("cy", p.y);

    /* ── 플래시 페이즈 (도착 직후 찰칵) ── */
    let dotR = 9, glowStd = 5, glowOp = 0.5;
    let flashR = 9, flashOp = 0, shockR = 9, shockOp = 0, veilOp = 0;
    if (i >= HOLD_IN + LAP && i < HOLD_IN + LAP + FLASH) {
      const f = i - (HOLD_IN + LAP); // 0..14
      if (f < 3) {
        /* 스웰: 도트가 부풀며 글로우 증폭 */
        const t = (f + 1) / 3;
        dotR = 9 + 8 * t;
        glowStd = 5 + 11 * t;
        glowOp = 0.5 + 0.5 * t;
      } else if (f < 12) {
        /* 터짐: 베일 점멸 + 버스트·충격파 확산 + 도트 복귀 */
        const t = (f - 3) / 9;
        flashR = 14 + 96 * t;
        flashOp = (1 - t) * (1 - t);
        shockR = 12 + 130 * t;
        shockOp = 0.85 * (1 - t);
        /* 베일: 첫 2프레임 강하게 점멸 후 급감 — "찰칵" */
        veilOp = f === 3 ? 0.4 : f === 4 ? 0.22 : Math.max(0, 0.1 * (1 - t * 2));
        dotR = 17 - 8 * Math.min(1, t * 1.5);
        glowStd = 16 - 11 * t;
        glowOp = 1 - 0.5 * t;
      }
      /* f 12–14: 정리(기본값 복귀) */
    }
    dot.setAttribute("r", dotR);
    glowShadow.setAttribute("stdDeviation", glowStd);
    glowShadow.setAttribute("flood-opacity", glowOp);
    flash.setAttribute("r", flashR);
    flash.setAttribute("opacity", flashOp);
    shock.setAttribute("r", shockR);
    shock.setAttribute("opacity", shockOp);
    veil.setAttribute("opacity", veilOp);
  };
</script>
</body>
</html>
